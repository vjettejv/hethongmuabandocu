# Historical recovery asset; immutable Git export required.
# Do not apply to canonical data; see docs/migration/phase-7-rollback.md.
# Apply last to restore only Node Post. Retain DB and exact shared volume.
services:
  post-service:
    image: kientrucpm-post-node-reference
    build: {context: ./.artifacts/phase7/legacy/post-service, dockerfile: Dockerfile}
    user: '0:0'
    volumes: !override
      - ./.artifacts/phase7/legacy/post-service/src:/app/src:ro
      - ./.artifacts/phase7/legacy/post-service/server.js:/app/server.js:ro
      - ./tools/runtime/legacy-schema-guard.cjs:/app/legacy-schema-guard.cjs:ro
      - shared_uploads:/app/uploads
    environment:
      NODE_OPTIONS: --require /app/legacy-schema-guard.cjs
      LEGACY_SCHEMA_SYNC: disabled
    healthcheck: !reset null
