# Historical recovery asset; immutable Git export required.
# Do not apply to canonical data; see docs/migration/phase-7-rollback.md.
# Apply LAST, after Phase 5, to restore only the three legacy Node services.
services:
  favorite-service:
    image: kientrucpm-favorite-service
    build: {context: ./.artifacts/phase7/legacy/favorite-service, dockerfile: Dockerfile}
    command: [node, server.js]
    user: "0:0"
    healthcheck: !reset {}
    volumes: !override
      - ./.artifacts/phase7/legacy/favorite-service/src:/app/src:ro
      - ./.artifacts/phase7/legacy/favorite-service/server.js:/app/server.js:ro
      - ./tools/runtime/legacy-schema-guard.cjs:/app/legacy-schema-guard.cjs:ro
    environment:
      NODE_OPTIONS: --require /app/legacy-schema-guard.cjs
      LEGACY_SCHEMA_SYNC: disabled
  review-service:
    image: kientrucpm-review-service
    build: {context: ./.artifacts/phase7/legacy/review-service, dockerfile: Dockerfile}
    command: [node, server.js]
    user: "0:0"
    healthcheck: !reset {}
    volumes: !override
      - ./.artifacts/phase7/legacy/review-service/src:/app/src:ro
      - ./.artifacts/phase7/legacy/review-service/server.js:/app/server.js:ro
      - ./tools/runtime/legacy-schema-guard.cjs:/app/legacy-schema-guard.cjs:ro
      - shared_uploads:/app/uploads
    environment:
      NODE_OPTIONS: --require /app/legacy-schema-guard.cjs
      LEGACY_SCHEMA_SYNC: disabled
  search-service:
    image: kientrucpm-search-service
    build: {context: ./.artifacts/phase7/legacy/search-service, dockerfile: Dockerfile}
    command: [node, server.js]
    user: "0:0"
    healthcheck: !reset {}
    volumes: !override
      - ./.artifacts/phase7/legacy/search-service/src:/app/src:ro
      - ./.artifacts/phase7/legacy/search-service/server.js:/app/server.js:ro
      - ./tools/runtime/legacy-schema-guard.cjs:/app/legacy-schema-guard.cjs:ro
    environment:
      NODE_OPTIONS: --require /app/legacy-schema-guard.cjs
      LEGACY_SCHEMA_SYNC: disabled
