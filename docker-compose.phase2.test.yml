# Opt-in isolated parity services. Schema-only clones, never Django test DB creation.
services:
  auth-reference:
    profiles: [phase2-test]
    ports: ["127.0.0.1::3001"]
    image: kientrucpm-auth-node-reference
    build:
      context: ./.artifacts/phase7/legacy/auth-service
      dockerfile: Dockerfile
    environment:
      PORT: '3001'
      DB_HOST: auth-db
      DB_NAME: phase2_auth_node
      DB_USER: ${PYTHON_DB_USER:?Set DB user}
      DB_PASSWORD: ${PYTHON_DB_PASSWORD:?Set DB password}
      JWT_SECRET: ${JWT_SECRET:?Set shared JWT key}
      NOTIFICATION_SERVICE_URL: http://notification-test:3006
      USER_SERVICE_URL: http://user-test:3002
      NODE_OPTIONS: --require /app/node-reference-preload.cjs
      LEGACY_SCHEMA_SYNC: disabled
    volumes:
      - ./.artifacts/phase7/legacy/auth-service/src:/app/src:ro
      - ./.artifacts/phase7/legacy/auth-service/server.js:/app/server.js:ro
      - ./tools/runtime/legacy-schema-guard.cjs:/app/legacy-schema-guard.cjs:ro
      - ./tools/runtime/node-reference-preload.cjs:/app/node-reference-preload.cjs:ro
    networks: [do-cu-micro-net]
  auth-candidate:
    profiles: [phase2-test]
    ports: ["127.0.0.1::3001"]
    image: kientrucpm-auth-service
    environment:
      SERVICE_NAME: auth-service
      PORT: '3001'
      SECRET_KEY: ${PYTHON_SECRET_KEY:?Set Django key}
      JWT_SECRET: ${JWT_SECRET:?Set shared JWT key}
      ALLOWED_HOSTS: localhost,127.0.0.1,auth-candidate
      DB_HOST: auth-db
      DB_PORT: '3306'
      DB_NAME: phase2_auth_python
      DB_USER: ${PYTHON_DB_USER:?Set DB user}
      DB_PASSWORD: ${PYTHON_DB_PASSWORD:?Set DB password}
      USER_SERVICE_URL: http://user-test:3002
      NOTIFICATION_SERVICE_URL: http://notification-test:3006
    networks: [do-cu-micro-net]
  user-test:
    profiles: [phase2-test]
    ports: ["127.0.0.1::3002"]
    image: kientrucpm-user-service
    environment:
      PORT: '3002'
      DB_HOST: user-db
      DB_NAME: phase2_user_test
      DB_USER: ${PYTHON_DB_USER:?Set DB user}
      DB_PASSWORD: ${PYTHON_DB_PASSWORD:?Set DB password}
      JWT_SECRET: ${JWT_SECRET:?Set shared JWT key}
      NODE_OPTIONS: --require /app/legacy-schema-guard.cjs
      LEGACY_SCHEMA_SYNC: disabled
    volumes:
      - ./.artifacts/phase7/legacy/user-service/src:/app/src:ro
      - ./.artifacts/phase7/legacy/user-service/server.js:/app/server.js:ro
      - ./tools/runtime/legacy-schema-guard.cjs:/app/legacy-schema-guard.cjs:ro
    networks: [do-cu-micro-net]
  notification-test:
    profiles: [phase2-test]
    ports: ["127.0.0.1::3006"]
    image: kientrucpm-notification-service
    environment:
      PORT: '3006'
      MOCK_EMAIL: 'true'
    volumes:
      - ./.artifacts/phase7/legacy/notification-service/src:/app/src:ro
      - ./.artifacts/phase7/legacy/notification-service/server.js:/app/server.js:ro
    networks: [do-cu-micro-net]
  proxy-fixture:
    profiles: [phase2-test]
    image: kientrucpm-post-service
    command: [node, /fixtures/proxy-fixture.cjs]
    volumes:
      - ./tools/runtime/proxy-fixture.cjs:/fixtures/proxy-fixture.cjs:ro
    networks: [do-cu-micro-net]
  gateway-probe:
    profiles: [phase2-test]
    image: kientrucpm-api-gateway
    ports: ["127.0.0.1::3000"]
    environment:
      SERVICE_NAME: api-gateway
      PORT: '3000'
      AUTH_SERVICE_URL: http://auth-candidate:3001
      POST_SERVICE_URL: http://proxy-fixture:3003
      USER_SERVICE_URL: http://user-test:3002
      MESSAGE_SERVICE_URL: http://message-service:3005
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    networks: [do-cu-micro-net]
