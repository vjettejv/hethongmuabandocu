# Owned clones, localhost-only published ports, synthetic SMTP only.
services:
  message-phase6-node:
    profiles:
    - phase6-test
    image: kientrucpm-message-service
    ports:
    - 127.0.0.1::3005
    environment:
      JWT_SECRET: ${JWT_SECRET:?Set shared JWT key}
      DB_USER: ${PYTHON_DB_USER:?Set DB user}
      DB_PASSWORD: ${PYTHON_DB_PASSWORD:?Set DB password}
      NODE_OPTIONS: --require /app/phase3-reference-preload.cjs
      LEGACY_SCHEMA_SYNC: disabled
      PORT: '3005'
      SERVICE_NAME: message-service
      DB_HOST: message-db
      DB_NAME: phase6_message_node
      AUTH_SERVICE_URL: http://dependencies-phase6-node:3011/auth
      USER_SERVICE_URL: http://dependencies-phase6-node:3011/users
      NOTIFICATION_SERVICE_URL: http://dependencies-phase6-node:3011
    networks:
    - do-cu-micro-net
    volumes:
    - ./.artifacts/phase7/legacy/message-service/src:/app/src:ro
    - ./.artifacts/phase7/legacy/message-service/server.js:/app/server.js:ro
    - ./tools/runtime/legacy-schema-guard.cjs:/app/legacy-schema-guard.cjs:ro
    - ./tools/runtime/phase3-reference-preload.cjs:/app/phase3-reference-preload.cjs:ro
  dependencies-phase6-node:
    profiles:
    - phase6-test
    image: kientrucpm-message-service
    ports:
    - 127.0.0.1::3011
    environment:
      AUTH_SERVICE_URL: http://auth-phase6:3001
      USER_SERVICE_URL: http://user-phase6:3002
      NOTIFICATION_SERVICE_URL: http://notification-phase6-python:3006
      SEARCH_SERVICE_URL: http://search-phase6:3008
    networks:
    - do-cu-micro-net
    volumes:
    - ./tools/runtime/phase6-dependencies.cjs:/fixtures/dependencies.cjs:ro
    command:
    - node
    - /fixtures/dependencies.cjs
  notification-phase6-node:
    profiles:
    - phase6-test
    image: kientrucpm-notification-service
    ports:
    - 127.0.0.1::3006
    environment:
      PORT: '3006'
      NODE_ENV: development
      MOCK_EMAIL: 'false'
      SMTP_HOST: smtp-phase6
      SMTP_PORT: '2525'
      SMTP_USER: sender@phase6.local.test
      SMTP_PASS: synthetic-test-only
      SMTP_TIMEOUT: '3'
    networks:
    - do-cu-micro-net
  notification-phase6-node-production-mock:
    profiles:
    - phase6-test
    image: kientrucpm-notification-service
    ports:
    - 127.0.0.1::3006
    environment:
      PORT: '3006'
      NODE_ENV: production
      MOCK_EMAIL: 'true'
      SMTP_HOST: smtp-phase6
      SMTP_PORT: '2525'
      SMTP_USER: sender@phase6.local.test
      SMTP_PASS: synthetic-test-only
      SMTP_TIMEOUT: '3'
    networks:
    - do-cu-micro-net
  notification-phase6-node-missing-user:
    profiles:
    - phase6-test
    image: kientrucpm-notification-service
    ports:
    - 127.0.0.1::3006
    environment:
      PORT: '3006'
      NODE_ENV: production
      MOCK_EMAIL: 'false'
      SMTP_HOST: smtp-phase6
      SMTP_PORT: '2525'
      SMTP_USER: ''
      SMTP_PASS: synthetic-test-only
      SMTP_TIMEOUT: '3'
    networks:
    - do-cu-micro-net
  notification-phase6-node-smtp:
