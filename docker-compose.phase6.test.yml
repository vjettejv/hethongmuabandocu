    - 127.0.0.1::3005
    environment:
      SECRET_KEY: ${PYTHON_SECRET_KEY:?Set Django key}
      JWT_SECRET: ${JWT_SECRET:?Set shared JWT key}
      DB_USER: ${PYTHON_DB_USER:?Set DB user}
      DB_PASSWORD: ${PYTHON_DB_PASSWORD:?Set DB password}
      DB_PORT: '3306'
      ALLOWED_HOSTS: '*'
      DEPENDENCY_TIMEOUT: '3'
      PORT: '3005'
      SERVICE_NAME: message-service
      DB_HOST: message-db
      DB_NAME: phase6_message_python
      AUTH_SERVICE_URL: http://dependencies-phase6-python:3011/auth
      USER_SERVICE_URL: http://dependencies-phase6-python:3011/users
