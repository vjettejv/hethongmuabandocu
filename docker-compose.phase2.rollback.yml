# Historical recovery asset; immutable Git export required.
# Do not apply to canonical data; see docs/migration/phase-7-rollback.md.
# Optional rollback overlay LAST, after docker-compose.yml and docker-compose.phase2.yml.
# Configuration is validated; rollback is not applied automatically.
services:
  api-gateway:
    image: kientrucpm-api-gateway-node-rollback
    build:
      context: ./.artifacts/phase7/legacy/api-gateway
      dockerfile: Dockerfile
    healthcheck:
      disable: true
  auth-service:
    image: kientrucpm-auth-node-reference
    build:
      context: ./.artifacts/phase7/legacy/auth-service
      dockerfile: Dockerfile
    environment:
      NODE_OPTIONS: --require /app/legacy-schema-guard.cjs
      LEGACY_SCHEMA_SYNC: disabled
    volumes:
      - ./tools/runtime/legacy-schema-guard.cjs:/app/legacy-schema-guard.cjs:ro
      - ./.artifacts/phase7/legacy/auth-service/src:/app/src:ro
      - ./.artifacts/phase7/legacy/auth-service/server.js:/app/server.js:ro
    healthcheck:
      disable: true
