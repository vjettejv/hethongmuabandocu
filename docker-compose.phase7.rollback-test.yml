# Isolated recovery rehearsal only. Never combine with canonical Compose.
name: phase7-legacy-recovery
services:
  db:
    image: mysql:8.0
    command: ["--lower-case-table-names=1"]
    environment:
      MYSQL_ROOT_PASSWORD: ${PHASE7_ROLLBACK_PASSWORD:?Set a disposable rehearsal password}
    tmpfs: [/var/lib/mysql]
    networks:
      default:
        aliases: [auth-db, post-db, category-db]
  api-gateway:
    image: phase7-legacy-gateway
    build:
      context: ${PHASE7_LEGACY_DIR:?Export immutable baseline first}/api-gateway
    ports: ["127.0.0.1::3000"]
    environment:
      AUTH_SERVICE_URL: http://auth-service:3001
      POST_SERVICE_URL: http://post-service:3003
      CATEGORY_SERVICE_URL: http://category-service:3004
  auth-service:
    image: phase7-legacy-auth
    build:
      context: ${PHASE7_LEGACY_DIR}/auth-service
    environment:
      PORT: '3001'
      DB_HOST: db
      DB_NAME: auth_db
      DB_USER: root
      DB_PASSWORD: ${PHASE7_ROLLBACK_PASSWORD:?Set disposable password}
      JWT_SECRET: ${PHASE7_ROLLBACK_PASSWORD:?Set disposable password}
      NODE_OPTIONS: --require /app/legacy-schema-guard.cjs
      LEGACY_SCHEMA_SYNC: disabled
    volumes:
      - ${PHASE7_LEGACY_DIR}/auth-service/src:/app/src:ro
      - ${PHASE7_LEGACY_DIR}/auth-service/server.js:/app/server.js:ro
      - ./tools/runtime/legacy-schema-guard.cjs:/app/legacy-schema-guard.cjs:ro
  post-service:
    image: phase7-legacy-post
    build:
      context: ${PHASE7_LEGACY_DIR}/post-service
    environment:
      PORT: '3003'
      DB_HOST: db
      DB_NAME: post_db
      DB_USER: root
      DB_PASSWORD: ${PHASE7_ROLLBACK_PASSWORD:?Set disposable password}
      CATEGORY_SERVICE_URL: http://category-service:3004
      NODE_OPTIONS: --require /app/legacy-schema-guard.cjs
      LEGACY_SCHEMA_SYNC: disabled
    volumes:
      - ${PHASE7_LEGACY_DIR}/post-service/src:/app/src:ro
      - ${PHASE7_LEGACY_DIR}/post-service/server.js:/app/server.js:ro
      - ./tools/runtime/legacy-schema-guard.cjs:/app/legacy-schema-guard.cjs:ro
    tmpfs: [/app/uploads]
  category-service:
    image: phase7-legacy-category
    build:
      context: ${PHASE7_LEGACY_DIR}/category-service
    environment:
      PORT: '3004'
      DB_HOST: db
      DB_NAME: category_db
      DB_USER: root
      DB_PASSWORD: ${PHASE7_ROLLBACK_PASSWORD:?Set disposable password}
      NODE_OPTIONS: --require /app/legacy-schema-guard.cjs
      LEGACY_SCHEMA_SYNC: disabled
    volumes:
      - ${PHASE7_LEGACY_DIR}/category-service/src:/app/src:ro
      - ${PHASE7_LEGACY_DIR}/category-service/server.js:/app/server.js:ro
      - ./tools/runtime/legacy-schema-guard.cjs:/app/legacy-schema-guard.cjs:ro
