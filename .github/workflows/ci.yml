name: CI

on:
  pull_request:
  push:
    branches: [develop, main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-python:
    name: Ruff, Python tests and service checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0 # Contract oracle reads the recorded migration baseline commit.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.lock.txt
      - name: MySQL client build prerequisites
        run: sudo apt-get update && sudo apt-get install -y pkg-config default-libmysqlclient-dev
      - name: Locked development dependencies
        run: python -m pip install -r requirements-dev.lock.txt
      - name: Dependency consistency
        run: python -m pip check
      - name: Ruff, nine Django checks, gateway import and unit/contract tests
        run: python tools/verify_foundation.py

  frontend:
    name: Frontend contracts and production build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: do-cu-frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: do-cu-frontend/package-lock.json
      - run: npm ci
      - run: node tests/frontend-contracts.test.js
      - run: npm run build

  docker-integration:
    name: Compose, eleven images and isolated Python integration
    needs: [quality-python, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CI_EVENT: ${{ github.event_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.lock.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: do-cu-frontend/package-lock.json
      - name: MySQL client build prerequisites
        run: sudo apt-get update && sudo apt-get install -y pkg-config default-libmysqlclient-dev
      - run: python -m pip install -r requirements-dev.lock.txt
      - run: python -m pip check
      - name: Socket.IO compatibility client dependencies
        run: npm ci --prefix do-cu-frontend
      - name: PR smoke or complete canonical integration
        shell: bash
        run: |
          if [ "$CI_EVENT" = "pull_request" ]; then
            python tools/verify_ci.py --smoke
          else
            python tools/verify_ci.py
          fi
      - name: Safe test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: canonical-integration-results
          path: |
            .artifacts/ci/**/integration.xml
            .artifacts/ci/**/result.json
          if-no-files-found: ignore
          retention-days: 7
