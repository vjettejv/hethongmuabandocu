name: Docker images

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish validated images (main/develop or version tag only)
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  images:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - service: api-gateway
            context: api-gateway
          - service: auth-service
            context: auth-service
          - service: user-service
            context: user-service
          - service: post-service
            context: post-service
          - service: category-service
            context: category-service
          - service: message-service
            context: message-service
          - service: notification-service
            context: notification-service
          - service: review-service
            context: review-service
          - service: search-service
            context: search-service
          - service: favorite-service
            context: favorite-service
          - service: frontend
            context: do-cu-frontend
    env:
      REPOSITORY: ${{ github.repository }}
      SERVICE: ${{ matrix.service }}
      RELEASE_REF: ${{ github.ref }}
      PUBLISH: ${{ github.event_name == 'push' || inputs.publish == true }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate release ref and derive lowercase image name
        id: image
        shell: bash
        run: |
          if [[ "$RELEASE_REF" == refs/tags/* ]]; then
            [[ "$RELEASE_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || exit 1
          elif [[ "$PUBLISH" == true ]]; then
            [[ "$RELEASE_REF" == refs/heads/main || "$RELEASE_REF" == refs/heads/develop ]] || exit 1
          fi
          echo "name=ghcr.io/${REPOSITORY,,}-${SERVICE}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: GHCR authentication (only for publication)
        if: env.PUBLISH == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=ref,event=tag
            type=sha,format=long
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
      - name: Build images (push only on authorized trigger)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./${{ matrix.context }}
          file: ./${{ matrix.context }}/Dockerfile
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
