# Apply after phase4.test; Node reference side remains unchanged.
services:
  search-phase4-python:
    image: kientrucpm-search-python-phase5
    volumes: !reset []
    environment:
      NODE_OPTIONS: null
      LEGACY_SCHEMA_SYNC: null
      SECRET_KEY: ${PYTHON_SECRET_KEY:?Set Django key}
      SERVICE_NAME: search-service
      ALLOWED_HOSTS: localhost,127.0.0.1,search-phase4-python
  favorite-phase4:
    image: kientrucpm-favorite-python-phase5
    volumes: !reset []
    environment:
      NODE_OPTIONS: null
      LEGACY_SCHEMA_SYNC: null
      SECRET_KEY: ${PYTHON_SECRET_KEY:?Set Django key}
      SERVICE_NAME: favorite-service
      ALLOWED_HOSTS: localhost,127.0.0.1,favorite-phase4
