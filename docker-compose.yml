version: '3.8'

services:
  user-db:
    image: mysql:8.0
    container_name: do-cu-user-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: user_db
    ports:
      - "3308:3306"

  post-db:
    image: mysql:8.0
    container_name: do-cu-post-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: post_db
    ports:
      - "3309:3306"