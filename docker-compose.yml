# Canonical Python stack; existing named data volumes are external.
name: kientrucpm
networks:
  do-cu-micro-net:
    name: kientrucpm_do-cu-micro-net
    driver: bridge
services:
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    depends_on:
    - auth-service
    - category-service
    - favorite-service
    - message-service
    - notification-service
    - post-service
    - review-service
    - search-service
    - user-service
    environment:
      AUTH_SERVICE_URL: http://auth-service:3001
      CATEGORY_SERVICE_URL: http://category-service:3004
      CONNECT_TIMEOUT: '5'
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost,http://localhost:80,http://127.0.0.1
      FAVORITE_SERVICE_URL: http://favorite-service:3009
      MESSAGE_SERVICE_URL: http://message-service:3005
      NOTIFICATION_SERVICE_URL: http://notification-service:3006
      PORT: '3000'
      POST_SERVICE_URL: http://post-service:3003
      READ_TIMEOUT: '30'
      REVIEW_SERVICE_URL: http://review-service:3007
      SEARCH_SERVICE_URL: http://search-service:3008
      SERVICE_NAME: api-gateway
      USER_SERVICE_URL: http://user-service:3002
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/health',
        timeout=3)
      timeout: 5s
      interval: 10s
      retries: 3
      start_period: 10s
    networks:
    - do-cu-micro-net
    ports:
    - target: 3000
      published: '3000'
      protocol: tcp
    restart: unless-stopped
  auth-db:
    command:
    - --lower_case_table_names=1
    container_name: do-cu-auth-db
    healthcheck:
      test:
      - CMD-SHELL
      - 'MYSQL_PWD="$${MYSQL_ROOT_PASSWORD}" mysql -h127.0.0.1 -uroot --silent -e "SELECT 1"'
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    environment:
      MYSQL_DATABASE: auth_db
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set existing MySQL root password}
    image: mysql:8.0
    networks:
    - do-cu-micro-net
    ports:
    - target: 3306
      published: '3307'
      protocol: tcp
    restart: unless-stopped
    volumes:
    - type: volume
      source: auth_data
      target: /var/lib/mysql
    - type: bind
      source: ./seeds/schema/auth.sql
      target: /docker-entrypoint-initdb.d/1_init.sql
  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    depends_on:
    - auth-db
    environment:
      ALLOWED_HOSTS: localhost,127.0.0.1,auth-service,auth-service-python,auth-candidate
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost,http://localhost:80,http://127.0.0.1
      DB_CONNECT_TIMEOUT: '3'
      DB_HOST: auth-db
      DB_NAME: auth_db
      DB_PASSWORD: ${PYTHON_DB_PASSWORD:?Set existing database password}
      DB_PORT: '3306'
      DB_USER: ${PYTHON_DB_USER:?Set existing database user}
      DEBUG: 'false'
      INTERNAL_HTTP_TIMEOUT: '5'
      JWT_SECRET: ${JWT_SECRET:?Set existing shared JWT key}
      NOTIFICATION_SERVICE_URL: http://notification-service:3006
      PORT: '3001'
      SECRET_KEY: ${PYTHON_SECRET_KEY:?Set Django secret key}
      SERVICE_NAME: auth-service
      USER_SERVICE_URL: http://user-service:3002
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:3001/health',
        timeout=3)
      timeout: 5s
      interval: 10s
      retries: 3
      start_period: 10s
    networks:
    - do-cu-micro-net
    restart: unless-stopped
  category-db:
