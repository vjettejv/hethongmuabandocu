      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    environment:
      MYSQL_DATABASE: category_db
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set existing MySQL root password}
    image: mysql:8.0
